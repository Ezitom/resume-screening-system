<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set Your Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f9fafb; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 2rem; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    h2 { font-size: 22px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    button { width: 100%; padding: 12px; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 500; }
    .error { color: red; font-size: 13px; margin-bottom: 12px; display: none; }
    .success { color: green; font-size: 13px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Welcome!</h2>
    <p>You have been invited to join the platform. Set your password below to get started.</p>
    <label>New Password</label>
    <input type="password" id="new-password" placeholder="Minimum 8 characters" />
    <label>Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Re-enter your password" />
    <div id="set-error" class="error"></div>
    <div id="set-success" class="success"></div>
    <button id="set-password-btn">Set Password & Login</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="supabase-client.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module">
    async function handleInviteLink() {
      // Check URL hash first
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      // Also check query params
      const queryParams = new URLSearchParams(window.location.search);

      const accessToken = hashParams.get("access_token") || queryParams.get("access_token");
      const refreshToken = hashParams.get("refresh_token") || queryParams.get("refresh_token");
      const type = hashParams.get("type") || queryParams.get("type");

      console.log("Hash:", window.location.hash);
      console.log("Search:", window.location.search);
      console.log("Access token:", accessToken);
      console.log("Type:", type);

      if (accessToken) {
        const { error } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (error) {
          document.getElementById("set-error").textContent = "Invalid or expired invite link. Please ask the admin to send a new invite.";
          document.getElementById("set-error").style.display = "block";
          document.getElementById("set-password-btn").disabled = true;
          return;
        }
        console.log("[OK] Session set successfully");
      } else {
        // No token found
        console.log("No token found in URL parameters, showing form anyway");
      }
    }

    handleInviteLink();

    document.getElementById("set-password-btn").addEventListener("click", async () => {
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const setBtn = document.getElementById("set-password-btn");
      const setError = document.getElementById("set-error");
      const setSuccess = document.getElementById("set-success");

      setError.style.display = "none";

      if (!newPassword || !confirmPassword) {
        setError.textContent = "Please fill in both password fields.";
        setError.style.display = "block";
        return;
      }

      if (newPassword !== confirmPassword) {
        setError.textContent = "Passwords do not match. Please try again.";
        setError.style.display = "block";
        return;
      }

      if (newPassword.length < 8) {
        setError.textContent = "Password must be at least 8 characters long.";
        setError.style.display = "block";
        return;
      }

      setBtn.textContent = "Setting up your account...";
      setBtn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
        if (error) throw error;

        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          await supabaseClient
            .from("recruiters")
            .update({ status: "active" })
            .eq("id", user.id);
        }

        setSuccess.textContent = "Password set successfully! Redirecting to your dashboard...";
        setSuccess.style.display = "block";
        setTimeout(() => { window.location.href = "dashboard.html"; }, 2000);

      } catch (err) {
        setError.textContent = err.message;
        setError.style.display = "block";
        setBtn.textContent = "Set Password & Login";
        setBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
