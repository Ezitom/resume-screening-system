<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="supabase-client.js"></script>
    <script type="module" src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EBEN</title>
    <script>
        (function () {
            const theme = localStorage.getItem('eben-theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="eben-login-body">
    <!-- Top Nav -->
    <nav class="eben-nav--login">
        <div class="eben-nav__inner">
            <a href="/" class="eben-logo">
                <span class="eben-logo-bar"></span>EBEN
            </a>
        </div>
    </nav>

    <main class="eben-auth-main">
        <div class="eben-auth-card">
            <div class="eben-auth-header">
                <h2 class="eben-auth-title" style="font-size: 2.2rem;">Forgot Password</h2>
                <p class="eben-auth-subtitle">Enter your email and we'll send you a password reset link.</p>
            </div>

            <div id="reset-error" style="display: none; margin-bottom: 24px; padding: 16px; border-radius: 12px; background-color: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; font-size: 0.9rem; text-align: center;"></div>
            <div id="reset-success" style="display: none; margin-bottom: 24px; padding: 16px; border-radius: 12px; background-color: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #86efac; font-size: 0.9rem; text-align: center;"></div>

            <form class="eben-auth-form" id="forgot-password-form">
                <div class="eben-form-group">
                    <label class="eben-form-label eben-uppercase-label" for="reset-email">Email Address</label>
                    <input class="eben-input" type="email" id="reset-email" placeholder="recruiter@email.com" required>
                </div>

                <button class="eben-btn eben-btn-primary eben-btn-full" id="reset-btn" type="submit" style="margin-top: 16px;">
                    Send Reset Link
                </button>

                <p class="eben-auth-switch" style="margin-top: 32px; font-size: 0.95rem;">
                    <a href="/login" class="eben-link" style="margin: 0; color: var(--eben-accent);">Back to Login</a>
                </p>
            </form>
        </div>
    </main>

    <script type="module" src="js/theme.js"></script>
    <script type="module">
        const forgotForm = document.getElementById("forgot-password-form");
        const resetBtn = document.getElementById("reset-btn");
        const emailInput = document.getElementById("reset-email");
        const errorEl = document.getElementById("reset-error");
        const successEl = document.getElementById("reset-success");

        forgotForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorEl.style.display = "none";
            successEl.style.display = "none";
            resetBtn.disabled = true;
            resetBtn.textContent = "Sending...";

            try {
                await sendPasswordReset(emailInput.value);
                successEl.textContent = "Reset link sent! Please check your email inbox.";
                successEl.style.display = "block";
                emailInput.value = "";
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = "block";
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
